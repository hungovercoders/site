<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" role="img" aria-labelledby="awsTitle awsDesc">
  <title id="awsTitle">The deployed beer sales job in AWS</title>
  <desc id="awsDesc">A flow that reads left to right. On the left a schedule card, EventBridge Scheduler at 06:00 UTC daily or a run by hand, has an arrow labelled starts into a blue Fargate task card in the middle that runs dbt build, with DuckDB doing the work inside the container against the s3 target. Above the task an ECR repository card holding the beer-sales image has an arrow down into the task labelled pulls. On the right a green S3 bucket card holds raw/events and summary; an arrow labelled reads runs from the bucket to the task and a green arrow labelled writes runs from the task back to the bucket. Below the task, a grey arrow labelled logs leads to a CloudWatch Logs card for the /ecs/beer-sales log group. A red arrow labelled fails leads down from the task to an EventBridge rule card, which matches a task that stopped with an exit code other than 0 or never started, then on to an SNS topic card called beer-sales-alerts, then to an email card saying the job failed.</desc>
  <defs>
    <style>
      .h { font-family: 'Lora', Georgia, Cambria, serif; font-size: 15px; font-weight: 700; fill: rgb(34, 41, 57); }
      .big { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: rgb(34, 41, 57); }
      .label { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 11px; fill: rgb(34, 41, 57); }
      .body { font-family: 'Atkinson', system-ui, sans-serif; font-size: 11px; fill: rgb(96, 115, 159); }
      .pill { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #fff; }
      .tag { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; fill: rgb(96, 115, 159); }
      .tagGreen { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; fill: #1ea672; }
      .tagRed { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; fill: #b54343; }
      .card { fill: #fff; stroke: rgb(229, 233, 240); }
      .arrow { stroke: rgb(96, 115, 159); fill: none; stroke-width: 1.5; }
      .arrowGreen { stroke: #1ea672; fill: none; stroke-width: 1.8; }
      .arrowRed { stroke: #b54343; fill: none; stroke-width: 1.8; }
    </style>
    <marker id="awsArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="rgb(96, 115, 159)"/></marker>
    <marker id="awsArrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1ea672"/></marker>
    <marker id="awsArrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b54343"/></marker>
  </defs>
  <rect width="720" height="384" fill="#f8f9fb"/>
  <text x="20" y="30" class="h">The deployed job in AWS</text>

  <!-- ECR -->
  <rect x="250" y="46" width="220" height="58" rx="6" class="card"/>
  <rect x="250" y="46" width="220" height="20" rx="6" fill="rgb(96, 115, 159)"/>
  <text x="260" y="60" class="pill">ECR REPOSITORY</text>
  <text x="260" y="82" class="label">beer-sales:latest</text>
  <text x="260" y="97" class="body">the image from our Dockerfile</text>
  <path d="M 360 104 L 360 138" class="arrow" marker-end="url(#awsArrow)"/>
  <text x="368" y="125" class="tag">pulls</text>

  <!-- schedule -->
  <rect x="20" y="154" width="160" height="76" rx="6" class="card"/>
  <rect x="20" y="154" width="160" height="20" rx="6" fill="rgb(96, 115, 159)"/>
  <text x="30" y="168" class="pill">SCHEDULE</text>
  <text x="30" y="194" class="label">06:00 UTC daily</text>
  <text x="30" y="212" class="body">Scheduler, or run by hand</text>
  <path d="M 180 192 L 228 192" class="arrow" marker-end="url(#awsArrow)"/>
  <text x="186" y="184" class="tag">starts</text>

  <!-- task -->
  <rect x="230" y="140" width="260" height="104" rx="6" fill="#dbe4ff" stroke="#2337ff" stroke-width="1.5"/>
  <rect x="230" y="140" width="260" height="22" rx="6" fill="#2337ff"/>
  <text x="240" y="155" class="pill">FARGATE TASK</text>
  <text x="242" y="184" class="big">dbt build</text>
  <text x="242" y="204" class="body">DuckDB does the work inside the container</text>
  <text x="242" y="228" class="label">target: s3</text>

  <!-- bucket -->
  <rect x="540" y="140" width="160" height="104" rx="6" fill="#d8f1e1" stroke="#1ea672"/>
  <rect x="540" y="140" width="160" height="22" rx="6" fill="#1ea672"/>
  <text x="550" y="155" class="pill">S3 BUCKET</text>
  <text x="552" y="182" class="label">raw/events/</text>
  <text x="552" y="197" class="body">the events come in</text>
  <text x="552" y="219" class="label">summary/</text>
  <text x="552" y="234" class="body">the summary goes out</text>
  <path d="M 540 174 L 492 174" class="arrow" marker-end="url(#awsArrow)"/>
  <text x="500" y="166" class="tag">reads</text>
  <path d="M 490 218 L 538 218" class="arrowGreen" marker-end="url(#awsArrowGreen)"/>
  <text x="496" y="210" class="tagGreen">writes</text>

  <!-- logs -->
  <path d="M 262 244 L 150 288" class="arrow" marker-end="url(#awsArrow)"/>
  <text x="174" y="262" class="tag">logs</text>
  <rect x="20" y="290" width="160" height="70" rx="6" class="card"/>
  <rect x="20" y="290" width="160" height="20" rx="6" fill="rgb(96, 115, 159)"/>
  <text x="30" y="304" class="pill">CLOUDWATCH LOGS</text>
  <text x="30" y="328" class="label">/ecs/beer-sales</text>
  <text x="30" y="345" class="body">the dbt build output</text>

  <!-- failure path -->
  <path d="M 360 244 L 360 288" class="arrowRed" marker-end="url(#awsArrowRed)"/>
  <text x="368" y="270" class="tagRed">fails</text>
  <rect x="250" y="290" width="200" height="70" rx="6" class="card"/>
  <rect x="250" y="290" width="200" height="20" rx="6" fill="#b54343"/>
  <text x="260" y="304" class="pill">EVENTBRIDGE RULE</text>
  <text x="260" y="328" class="body">task stopped with an exit code</text>
  <text x="260" y="345" class="body">other than 0, or never started</text>
  <path d="M 450 325 L 478 325" class="arrowRed" marker-end="url(#awsArrowRed)"/>
  <rect x="480" y="290" width="104" height="70" rx="6" class="card"/>
  <rect x="480" y="290" width="104" height="20" rx="6" fill="#b54343"/>
  <text x="490" y="304" class="pill">SNS TOPIC</text>
  <text x="490" y="328" class="label">beer-sales-</text>
  <text x="490" y="345" class="label">alerts</text>
  <path d="M 584 325 L 612 325" class="arrowRed" marker-end="url(#awsArrowRed)"/>
  <rect x="614" y="290" width="86" height="70" rx="6" class="card"/>
  <rect x="614" y="290" width="86" height="20" rx="6" fill="#b54343"/>
  <text x="624" y="304" class="pill">EMAIL</text>
  <text x="624" y="328" class="body">the job</text>
  <text x="624" y="345" class="body">failed</text>
</svg>
