<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 335" role="img" aria-labelledby="contractT contractD">
  <title id="contractT">One OpenAPI contract doing four jobs</title>
  <desc id="contractD">One box on the left, the contract, specs/openapi.yaml, written once. Four arrows fan out from it to four boxes on the right, one for each job it does. The router validates every request against it, so nobody hand-writes a 400. Terraform reads it and creates one API Gateway route per operation. The scenarios check every response against it for status, content type and body. Schemathesis generates requests from it, valid and daft alike, and checks the answers.</desc>
  <defs>
    <style>
      .h { font-family: 'Lora', Georgia, Cambria, serif; font-size: 14px; font-weight: 700; fill: rgb(34, 41, 57); }
      .sub { font-family: 'Atkinson', system-ui, sans-serif; font-size: 11px; fill: rgb(96, 115, 159); }
      .body { font-family: 'Atkinson', system-ui, sans-serif; font-size: 11px; fill: rgb(34, 41, 57); }
      .muted { font-family: 'Atkinson', system-ui, sans-serif; font-size: 10.5px; fill: rgb(96, 115, 159); }
      .mono { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10.5px; fill: rgb(34, 41, 57); }
      .pill { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #fff; }
      .lblRed { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #b54343; }
      .lblGreen { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #1ea672; }
      .lblOrange { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #e16e3c; }
      .cmd { fill: #e9deff; stroke: #7350dc; stroke-width: 1.5; }
      .cmdHead { fill: #7350dc; }
      .flowOrange { stroke: #e16e3c; fill: none; stroke-width: 1.8; }
      .bad { fill: #fff; stroke: #b54343; stroke-width: 1.5; }
      .badHead { fill: #b54343; }
      .good { fill: #fff; stroke: #1ea672; stroke-width: 1.5; }
      .goodHead { fill: #1ea672; }
      .once { fill: #fff; stroke: rgb(96, 115, 159); stroke-width: 1.5; }
      .onceHead { fill: rgb(96, 115, 159); }
      .spec { fill: #fee5d9; stroke: #e16e3c; stroke-width: 1.5; }
      .specHead { fill: #e16e3c; }
      .agent { fill: #fff; stroke: #2337ff; stroke-width: 1.5; }
      .agentHead { fill: #2337ff; }
      .gate { fill: rgb(216, 241, 225); stroke: #1ea672; stroke-width: 1.5; }
      .gateHead { fill: #1ea672; }
      .step { fill: #fff; stroke: rgb(229, 233, 240); }
      .flow { stroke: rgb(96, 115, 159); fill: none; stroke-width: 1.8; }
      .flowRed { stroke: #b54343; fill: none; stroke-width: 1.8; stroke-dasharray: 4 3; }
      .flowGreen { stroke: #1ea672; fill: none; stroke-width: 1.8; }
    </style>
    <marker id="uGrey" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="rgb(96, 115, 159)"/></marker>
    <marker id="uRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b54343"/></marker>
    <marker id="uGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1ea672"/></marker>
      <marker id="uOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e16e3c"/></marker>
  </defs>
  <rect width="720" height="335" fill="#f8f9fb"/>
  <text x="20" y="32" class="h">One contract, four jobs</text>
  <text x="20" y="50" class="sub">Written once, used by the code, the infrastructure and both kinds of test.</text>
  <rect x="20" y="128" width="190" height="84" rx="6" class="spec"/>
  <rect x="20" y="128" width="190" height="20" rx="6" class="specHead"/>
  <text x="115.0" y="142" text-anchor="middle" class="pill">YOU WRITE IT ONCE</text>
  <text x="31" y="166" class="body">The contract</text>
  <text x="31" y="182" class="mono">specs/openapi.yaml</text>
  <rect x="330" y="70" width="370" height="54" rx="6" class="agent"/>
  <rect x="330" y="70" width="370" height="20" rx="6" class="agentHead"/>
  <text x="515.0" y="84" text-anchor="middle" class="pill">THE ROUTER</text>
  <text x="341" y="108" class="body">Validates every request so nobody hand-writes a 400</text>
  <path d="M210,170 C270,170 270,97 328,97" class="flow" marker-end="url(#uGrey)"/>
  <rect x="330" y="132" width="370" height="54" rx="6" class="once"/>
  <rect x="330" y="132" width="370" height="20" rx="6" class="onceHead"/>
  <text x="515.0" y="146" text-anchor="middle" class="pill">TERRAFORM</text>
  <text x="341" y="170" class="body">Reads it and creates one API Gateway route per operation</text>
  <path d="M210,170 C270,170 270,159 328,159" class="flow" marker-end="url(#uGrey)"/>
  <rect x="330" y="194" width="370" height="54" rx="6" class="gate"/>
  <rect x="330" y="194" width="370" height="20" rx="6" class="gateHead"/>
  <text x="515.0" y="208" text-anchor="middle" class="pill">THE SCENARIOS</text>
  <text x="341" y="232" class="body">Check every response for status, content type and body</text>
  <path d="M210,170 C270,170 270,221 328,221" class="flow" marker-end="url(#uGrey)"/>
  <rect x="330" y="256" width="370" height="54" rx="6" class="gate"/>
  <rect x="330" y="256" width="370" height="20" rx="6" class="gateHead"/>
  <text x="515.0" y="270" text-anchor="middle" class="pill">SCHEMATHESIS</text>
  <text x="341" y="294" class="body">Generates requests from it, valid and daft, and checks the answers</text>
  <path d="M210,170 C270,170 270,283 328,283" class="flow" marker-end="url(#uGrey)"/>
</svg>
