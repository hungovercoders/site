  <text x="483.0" y="160" text-anchor="middle" class="pill">FORWARDER</text>
  <text x="454" y="184" class="muted">Puts each</text>
  <text x="454" y="199" class="muted">event on</text>
  <text x="454" y="214" class="muted">the bus</text>
