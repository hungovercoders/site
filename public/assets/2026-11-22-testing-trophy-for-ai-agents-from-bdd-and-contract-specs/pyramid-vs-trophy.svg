<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="pvtTitle pvtDesc">
  <title id="pvtTitle">The pyramid I expected and the trophy I had</title>
  <desc id="pvtDesc">Two shapes side by side joined by an arrow labelled then I counted. On the left, under the heading what I thought I had, a pyramid of three bands. A small band at the top, end-to-end, few and slow. A medium band in the middle, integration. A wide band at the bottom, unit, many and fast. On the right, under the heading what I had, a trophy of four bands. A small dashed band at the top, real AWS, empty. A wide green band below it, integration, the most. A narrow blue band, unit, a few. A wide purple band at the bottom, static checks.</desc>
  <defs><marker id="pArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="rgb(96, 115, 159)"/></marker></defs>
  <rect width="720" height="330" fill="#f8f9fb"/>
  <g font-family="'Lora', Georgia, Cambria, serif" font-weight="700" font-size="17" fill="rgb(34, 41, 57)">
    <text x="170" y="36" text-anchor="middle">What I thought I had</text>
    <text x="550" y="36" text-anchor="middle">What I had</text>
  </g>
  <g font-family="'Atkinson', system-ui, sans-serif" font-size="12.5" fill="rgb(34, 41, 57)" text-anchor="middle">
    <!-- pyramid -->
    <rect x="120" y="70" width="100" height="62" rx="5" fill="#fee5d9" stroke="#e16e3c"/>
    <text x="170" y="96" font-weight="700">End-to-end</text><text x="170" y="114" fill="rgb(96, 115, 159)">few, slow</text>
    <rect x="80" y="140" width="180" height="62" rx="5" fill="#d8f1e1" stroke="#1ea672"/>
    <text x="170" y="166" font-weight="700">Integration</text><text x="170" y="184" fill="rgb(96, 115, 159)">some</text>
    <rect x="30" y="210" width="280" height="62" rx="5" fill="#dbe4ff" stroke="#2337ff"/>
    <text x="170" y="236" font-weight="700">Unit</text><text x="170" y="254" fill="rgb(96, 115, 159)">many, fast</text>

    <!-- arrow -->
    <line x1="322" y1="171" x2="388" y2="171" stroke="rgb(96, 115, 159)" stroke-width="1.5" marker-end="url(#pArrow)"/>
    <text x="355" y="160" font-size="11.5" fill="rgb(96, 115, 159)">then I counted</text>

    <!-- trophy -->
    <rect x="490" y="62" width="120" height="44" rx="5" fill="#ffffff" stroke="rgb(140, 156, 188)" stroke-dasharray="5 4"/>
    <text x="550" y="81" font-weight="700">Real AWS</text><text x="550" y="97" fill="rgb(96, 115, 159)">empty</text>
    <rect x="410" y="114" width="280" height="62" rx="6" fill="#d8f1e1" stroke="#1ea672"/>
    <text x="550" y="140" font-weight="700">Integration</text><text x="550" y="158" fill="rgb(96, 115, 159)">the most, on AWS Emulator</text>
    <rect x="495" y="184" width="110" height="50" rx="5" fill="#dbe4ff" stroke="#2337ff"/>
    <text x="550" y="205" font-weight="700">Unit</text><text x="550" y="222" fill="rgb(96, 115, 159)">a few</text>
    <rect x="430" y="242" width="240" height="50" rx="6" fill="#e9deff" stroke="#7350dc"/>
    <text x="550" y="263" font-weight="700">Static checks</text><text x="550" y="280" fill="rgb(96, 115, 159)">lint, compatibility, plan tests</text>
  </g>
  <text x="20" y="316" font-family="'Atkinson', system-ui, sans-serif" font-size="11.5" fill="rgb(96, 115, 159)">Widths show where most of the testing is, not exact counts.</text>
</svg>
