  <text x="630.0" y="114" text-anchor="middle" class="pill">EVENTS OUT</text>
  <text x="570" y="138" class="muted">Subscribers, on a bus</text>
  <text x="570" y="155" class="mono">asyncapi · send</text>
  <rect x="560" y="202" width="140" height="78" rx="6" class="spec"/>
  <rect x="560" y="202" width="140" height="20" rx="6" class="specHead"/>
  <text x="630.0" y="216" text-anchor="middle" class="pill">EVENTS AS DATA</text>
  <text x="570" y="240" class="muted">Analysts, with DuckDB</text>
  <text x="570" y="257" class="mono">datacontract.yaml</text>
  <path d="M164,139 L196,139" class="flow" marker-end="url(#iGrey)" marker-start="url(#iGreyBack)"/>
  <path d="M160,241 L198,241" class="flow" marker-end="url(#iGrey)"/>
  <path d="M296,139 C306,139 300,172 310,177" class="flow" marker-end="url(#iGrey)"/>
  <path d="M296,241 C306,241 300,208 310,203" class="flow" marker-end="url(#iGrey)"/>
  <path d="M404,190 L442,190" class="flow" marker-end="url(#iGrey)"/>
  <text x="423" y="182" text-anchor="middle" class="lbl">stream</text>
  <path d="M522,176 C542,170 540,139 558,139" class="flow" marker-end="url(#iGrey)"/>
  <path d="M630,178 L630,200" class="flow" marker-end="url(#iGrey)"/>
  <text x="640" y="193" class="lbl">Firehose</text>
  <rect x="20" y="312" width="680" height="64" rx="8" class="once"/>
  <rect x="20" y="312" width="680" height="20" rx="8" class="onceHead"/>
  <text x="360" y="326" text-anchor="middle" class="pill">ONE SPEC · THE SAME FILES ARE THE TESTS</text>
  <text x="34" y="350" class="body">specs/features/*.feature say what every interface does, and run against all of it.</text>
  <text x="34" y="366" class="muted">A message sent, an event published and a row landed in S3 are each a step in a scenario.</text>
</svg>
