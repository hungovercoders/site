<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="pyrTitle pyrDesc">
  <title id="pyrTitle">The test pyramid</title>
  <desc id="pyrDesc">A pyramid of three bands on the left, with an arrow up its right side. A small band at the top, end-to-end, few. A medium band in the middle, integration, some. A wide band at the bottom, unit, many. The arrow runs from the bottom band to the top one and is labelled slower and vaguer going up: at the bottom a failure takes milliseconds and names the line, at the top it takes minutes and says something is broken somewhere. Beside the pyramid a separate box, joined to it by a dashed line, holds contract tests, which ask whether the code still matches what callers were promised.</desc>
  <defs><marker id="yArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="rgb(96, 115, 159)"/></marker></defs>
  <rect width="720" height="280" fill="#f8f9fb"/>
  <g font-family="'Atkinson', system-ui, sans-serif" font-size="12.5" fill="rgb(34, 41, 57)" text-anchor="middle">
    <rect x="130" y="30" width="100" height="62" rx="5" fill="#fee5d9" stroke="#e16e3c"/>
    <text x="180" y="56" font-weight="700">End-to-end</text><text x="180" y="74" fill="rgb(96, 115, 159)">few</text>
    <rect x="90" y="100" width="180" height="62" rx="5" fill="#d8f1e1" stroke="#1ea672"/>
    <text x="180" y="126" font-weight="700">Integration</text><text x="180" y="144" fill="rgb(96, 115, 159)">some</text>
    <rect x="40" y="170" width="280" height="62" rx="5" fill="#dbe4ff" stroke="#2337ff"/>
    <text x="180" y="196" font-weight="700">Unit</text><text x="180" y="214" fill="rgb(96, 115, 159)">many</text>
  </g>
  <line x1="350" y1="226" x2="350" y2="40" stroke="rgb(96, 115, 159)" stroke-width="1.5" marker-end="url(#yArrow)"/>
  <g font-family="'Atkinson', system-ui, sans-serif" font-size="12" fill="rgb(96, 115, 159)">
    <text x="364" y="54">minutes, "something broke"</text>
    <text x="364" y="136">slower and vaguer going up</text>
    <text x="364" y="218">milliseconds, names the line</text>
  </g>
  <g font-family="'Atkinson', system-ui, sans-serif" font-size="12.5" fill="rgb(34, 41, 57)">
    <line x1="548" y1="131" x2="566" y2="131" stroke="rgb(140, 156, 188)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="566" y="92" width="134" height="78" rx="5" fill="#e9deff" stroke="#7350dc"/>
    <text x="633" y="116" text-anchor="middle" font-weight="700">Contract tests</text>
    <text x="633" y="134" text-anchor="middle" fill="rgb(96, 115, 159)">beside the pyramid:</text>
    <text x="633" y="150" text-anchor="middle" fill="rgb(96, 115, 159)">still as promised?</text>
  </g>
  <text x="20" y="266" font-family="'Atkinson', system-ui, sans-serif" font-size="11.5" fill="rgb(96, 115, 159)">The shape is about cost: catch most mistakes at the bottom, where they are cheap.</text>
</svg>
