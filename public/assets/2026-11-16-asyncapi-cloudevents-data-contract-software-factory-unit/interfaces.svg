  <text x="210" y="142" class="muted">One function</text>
  <text x="210" y="157" class="muted">per operation</text>
  <rect x="200" y="206" width="96" height="70" rx="6" class="agent"/>
  <rect x="200" y="206" width="96" height="20" rx="6" class="agentHead"/>
  <text x="248.0" y="220" text-anchor="middle" class="pill">CONSUMERS</text>
  <text x="210" y="244" class="muted">One function</text>
  <text x="210" y="259" class="muted">per message</text>
  <rect x="312" y="146" width="92" height="88" rx="6" class="good"/>
  <rect x="312" y="146" width="92" height="20" rx="6" class="goodHead"/>
  <text x="358.0" y="160" text-anchor="middle" class="pill">DYNAMODB</text>
  <text x="322" y="184" class="muted">Your data and</text>
  <text x="322" y="199" class="muted">the outbox,</text>
  <text x="322" y="214" class="muted">in one write</text>
  <rect x="444" y="146" width="78" height="88" rx="6" class="good"/>
