<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 316" role="img" aria-labelledby="expTitle expDesc">
  <title id="expTitle">Why the summary has to be exported</title>
  <desc id="expDesc">Two rows that each read left to right. In the top row, without the export model, the events are read by the container running dbt build, the summary is a table in beers.duckdb inside that container, and when the job finishes the container is thrown away and the summary goes with it. In the bottom row, with the export model, the same events are read by the same container, and a green arrow labelled writes leads out to a summary file, daily_event_summary.parquet, on disk or in S3, which is still there after the container has gone.</desc>
  <defs>
    <style>
      .h { font-family: 'Lora', Georgia, Cambria, serif; font-size: 14px; font-weight: 700; fill: rgb(34, 41, 57); }
      .label { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 11px; fill: rgb(34, 41, 57); }
      .body { font-family: 'Atkinson', system-ui, sans-serif; font-size: 11px; fill: rgb(96, 115, 159); }
      .pill { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #fff; }
      .tag { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; fill: rgb(96, 115, 159); }
      .tagGreen { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; fill: #1ea672; }
      .tagFile { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; fill: rgb(34, 41, 57); }
      .tagRed { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; fill: #b54343; }
      .card { fill: #fff; stroke: rgb(229, 233, 240); }
      .arrow { stroke: rgb(96, 115, 159); fill: none; stroke-width: 1.5; }
      .arrowGreen { stroke: #1ea672; fill: none; stroke-width: 1.8; }
      .arrowRed { stroke: #b54343; fill: none; stroke-width: 1.8; }
    </style>
    <marker id="expArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="rgb(96, 115, 159)"/></marker>
    <marker id="expArrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1ea672"/></marker>
    <marker id="expArrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b54343"/></marker>
  </defs>
  <rect width="720" height="316" fill="#f8f9fb"/>

  <!-- without -->
  <text x="20" y="30" class="h">Without the export model</text>
  <rect x="20" y="44" width="150" height="84" rx="6" class="card"/>
  <rect x="20" y="44" width="150" height="20" rx="6" fill="rgb(96, 115, 159)"/>
  <text x="30" y="58" class="pill">EVENTS</text>
  <text x="30" y="88" class="label">raw/events/</text>
  <text x="30" y="106" class="body">parquet files</text>
  <path d="M 170 86 L 218 86" class="arrow" marker-end="url(#expArrow)"/>
  <text x="178" y="78" class="tag">reads</text>
  <rect x="220" y="44" width="240" height="84" rx="6" fill="#dbe4ff" stroke="#2337ff" stroke-width="1.5"/>
  <rect x="220" y="44" width="240" height="20" rx="6" fill="#2337ff"/>
  <text x="230" y="58" class="pill">CONTAINER · DBT BUILD</text>
  <text x="232" y="88" class="label">beers.duckdb</text>
  <text x="232" y="106" class="body">the summary is a table in here</text>
  <path d="M 460 86 L 508 86" class="arrowRed" marker-end="url(#expArrowRed)"/>
  <text x="464" y="78" class="tagRed">stops</text>
  <rect x="510" y="44" width="190" height="84" rx="6" class="card"/>
  <rect x="510" y="44" width="190" height="20" rx="6" fill="#b54343"/>
  <text x="520" y="58" class="pill">THE JOB FINISHES</text>
  <text x="520" y="88" class="body">the container is thrown away</text>
  <text x="520" y="106" class="body">and the summary goes with it</text>

  <!-- with -->
  <text x="20" y="178" class="h">With the export model</text>
  <rect x="20" y="192" width="150" height="84" rx="6" class="card"/>
  <rect x="20" y="192" width="150" height="20" rx="6" fill="rgb(96, 115, 159)"/>
  <text x="30" y="206" class="pill">EVENTS</text>
  <text x="30" y="236" class="label">raw/events/</text>
  <text x="30" y="254" class="body">parquet files</text>
  <path d="M 170 234 L 218 234" class="arrow" marker-end="url(#expArrow)"/>
  <text x="178" y="226" class="tag">reads</text>
  <rect x="220" y="192" width="240" height="84" rx="6" fill="#dbe4ff" stroke="#2337ff" stroke-width="1.5"/>
  <rect x="220" y="192" width="240" height="20" rx="6" fill="#2337ff"/>
  <text x="230" y="206" class="pill">CONTAINER · DBT BUILD</text>
  <text x="232" y="236" class="label">beers.duckdb</text>
  <text x="232" y="254" class="body">scratch space for the build</text>
  <path d="M 460 234 L 508 234" class="arrowGreen" marker-end="url(#expArrowGreen)"/>
  <text x="462" y="226" class="tagGreen">writes</text>
  <rect x="510" y="192" width="190" height="84" rx="6" fill="#d8f1e1" stroke="#1ea672"/>
  <rect x="510" y="192" width="190" height="20" rx="6" fill="#1ea672"/>
  <text x="520" y="206" class="pill">THE SUMMARY FILE</text>
  <text x="520" y="232" class="tagFile">daily_event_summary.parquet</text>
  <text x="520" y="250" class="body">on disk, or in S3</text>
  <text x="520" y="266" class="body">still there when the job has gone</text>
</svg>
